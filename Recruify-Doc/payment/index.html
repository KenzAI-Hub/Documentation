<style>
  body {
    margin: 0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Modern Top Navigation Bar */
  #recruify-top-navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 56px;

    color: #f8fafc;

    z-index: 10000;

  }

  .nav-left {
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    height: 28px;
  }

  .brand-logo-img {
    height: 24px;
    max-height: 24px;
    width: auto;
    max-width: 130px;
    object-fit: contain;
    display: block;
  }

  .nav-divider {

    background: #334155;
    flex-shrink: 0;

  .service-badge {

    border-radius: 9999px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .service-badge .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
    flex-shrink: 0;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .nav-label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .service-select {
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .service-select:hover, .service-select:focus {
    border-color: #38bdf8;
    background: #243248;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #334155;
    color: #f8fafc;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s ease;
  }

  .nav-btn:hover {
    background: #475569;
  }
</style>

      <option value="../interviews/index.html" >🎥 Interviews Microservice</option>
      <option value="../jobs/index.html" >💼 Jobs Microservice</option>
      <option value="../llm_metadata/index.html" >🧠 LLM Metadata Microservice</option>
      <option value="../notifications/index.html" >🔔 Notifications Microservice</option>

      <option value="../resumes/index.html" >📄 Resumes Microservice</option>

    <a href="../user-guide.html" class="nav-btn" title="View Step-by-Step User & Operations Guide" style="background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.35); color: #10b981;">

      User Guide
    </a>
    <a href="../architecture.html" class="nav-btn" title="View Inter-Service Dependency Graph & Architecture Matrix" style="background: rgba(124, 58, 237, 0.12); border-color: rgba(124, 58, 237, 0.35); color: #7c3aed;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Dependency Graph

    <a href="../openapi.json" target="_blank" class="nav-btn" title="Download raw OpenAPI JSON specification">

  </div>
</header>

    scrollYOffset: 56,
    hideDownloadButton: false,
    theme: {
      colors: {
        primary: {
          main: '#7c3aed'
        }
      }
    }
  }, document.getElementById('redoc-container'));

  // Switch microservice on dropdown selection
  document.getElementById('service-selector').addEventListener('change', function(e) {
    window.location.href = e.target.value;
  });

  // Real-time active microservice heading tracker for Unified platform
  const tagToService = {};
  const isUnified = false;

  function updateNavbarHeading() {
    if (!isUnified) return;
    const badge = document.getElementById('active-service-text');
    if (!badge) return;

    const hash = window.location.hash || '';
    if (!hash || hash === '#' || hash === '#/') {
      badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
      return;
    }

    // Extract tag from hash e.g. #/tag/JD-Flow or #/tag/JD-Flow/operation/xyz
    const tagMatch = hash.match(/#[\/]tag[\/]([^/?]+)/);
    if (tagMatch) {
      const rawSlug = decodeURIComponent(tagMatch[1]);
      let matchedService = null;
      let matchedTag = rawSlug;

      for (const [tag, service] of Object.entries(tagToService)) {
        const slugHyphen = tag.replace(/\s+/g, '-');
        const slugUnderscore = tag.replace(/\s+/g, '_');
        if (rawSlug === tag || rawSlug === slugHyphen || rawSlug === slugUnderscore || rawSlug.toLowerCase() === tag.toLowerCase()) {
          matchedService = service;
          matchedTag = tag;
          break;
        }
      }

      if (matchedService) {
        badge.innerHTML = `Active Service: <strong>${matchedService}</strong> &nbsp;›&nbsp; <span style="color: #f1f5f9; font-weight: 600;">${matchedTag}</span>`;
        return;
      }
    }

    badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
  }

  if (isUnified) {
    window.addEventListener('hashchange', updateNavbarHeading);
    document.addEventListener('click', function() {
      setTimeout(updateNavbarHeading, 120);
    });
    setTimeout(updateNavbarHeading, 300);
  }
</script>
