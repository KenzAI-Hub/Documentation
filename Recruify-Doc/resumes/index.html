    window.location.href = e.target.value;
  });

  // Real-time active microservice heading tracker for Unified platform
  const tagToService = {};
  const isUnified = false;

  function updateNavbarHeading() {
    if (!isUnified) return;
    const badge = document.getElementById('active-service-text');
    if (!badge) return;

    const hash = window.location.hash || '';
    if (!hash || hash === '#' || hash === '#/') {
      badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
      return;
    }

    // Extract tag from hash e.g. #/tag/JD-Flow or #/tag/JD-Flow/operation/xyz
    const tagMatch = hash.match(/#[\/]tag[\/]([^/?]+)/);
    if (tagMatch) {
      const rawSlug = decodeURIComponent(tagMatch[1]);
      let matchedService = null;
      let matchedTag = rawSlug;

      for (const [tag, service] of Object.entries(tagToService)) {
        const slugHyphen = tag.replace(/\s+/g, '-');
        const slugUnderscore = tag.replace(/\s+/g, '_');
        if (rawSlug === tag || rawSlug === slugHyphen || rawSlug === slugUnderscore || rawSlug.toLowerCase() === tag.toLowerCase()) {
          matchedService = service;
          matchedTag = tag;
          break;
        }
      }

      if (matchedService) {
        badge.innerHTML = `Active Service: <strong>${matchedService}</strong> &nbsp;›&nbsp; <span style="color: #f1f5f9; font-weight: 600;">${matchedTag}</span>`;
        return;
      }
    }

    badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
  }

  if (isUnified) {
    window.addEventListener('hashchange', updateNavbarHeading);
    document.addEventListener('click', function() {
      setTimeout(updateNavbarHeading, 120);
    });
    setTimeout(updateNavbarHeading, 300);
  }
