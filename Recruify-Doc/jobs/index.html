<style>

    left: 0;
    right: 0;
    height: 56px;
    background: #0f172a;

    color: #f8fafc;

    padding: 0 18px;
    z-index: 10000;

    align-items: center;
    gap: 14px;
    overflow: hidden;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    height: 28px;
  }

  .brand-logo-img {

    max-height: 24px;
    width: auto;
    max-width: 130px;
    object-fit: contain;
    display: block;
  }

  .nav-divider {
    width: 1px;
    height: 22px;
    background: #334155;
    flex-shrink: 0;
  }

  .service-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #38bdf8;
    padding: 5px 14px;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .service-badge .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #38bdf8;
    box-shadow: 0 0 8px #38bdf8;
    flex-shrink: 0;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .nav-label {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .service-select {
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .service-select:hover, .service-select:focus {
    border-color: #38bdf8;
    background: #243248;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #334155;
    color: #f8fafc;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    transition: background 0.15s ease;
  }

  .nav-btn:hover {
    background: #475569;
  }
</style>

  // Switch microservice on dropdown selection
  document.getElementById('service-selector').addEventListener('change', function(e) {
    window.location.href = e.target.value;
  });

  // Real-time active microservice heading tracker for Unified platform
  const tagToService = {};
  const isUnified = false;

  function updateNavbarHeading() {
    if (!isUnified) return;
    const badge = document.getElementById('active-service-text');
    if (!badge) return;

    const hash = window.location.hash || '';
    if (!hash || hash === '#' || hash === '#/') {
      badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
      return;
    }

    // Extract tag from hash e.g. #/tag/JD-Flow or #/tag/JD-Flow/operation/xyz
    const tagMatch = hash.match(/#[\/]tag[\/]([^/?]+)/);
    if (tagMatch) {
      const rawSlug = decodeURIComponent(tagMatch[1]);
      let matchedService = null;
      let matchedTag = rawSlug;

      for (const [tag, service] of Object.entries(tagToService)) {
        const slugHyphen = tag.replace(/\s+/g, '-');
        const slugUnderscore = tag.replace(/\s+/g, '_');
        if (rawSlug === tag || rawSlug === slugHyphen || rawSlug === slugUnderscore || rawSlug.toLowerCase() === tag.toLowerCase()) {
          matchedService = service;
          matchedTag = tag;
          break;
        }
      }

      if (matchedService) {
        badge.innerHTML = `Active Service: <strong>${matchedService}</strong> &nbsp;›&nbsp; <span style="color: #f1f5f9; font-weight: 600;">${matchedTag}</span>`;
        return;
      }
    }

    badge.innerHTML = 'Active Service: <strong>🌐 Unified Platform (All 14 Microservices)</strong>';
  }

  if (isUnified) {
    window.addEventListener('hashchange', updateNavbarHeading);
    document.addEventListener('click', function() {
      setTimeout(updateNavbarHeading, 120);
    });
    setTimeout(updateNavbarHeading, 300);
  }
